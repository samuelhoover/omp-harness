setupVersion: 3
bash:
  patterns:
    - match: git push*
      approval: deny
  gitGuard: true
modelRoles:
  tiny: anthropic/claude-haiku-5-5:low
  smol: anthropic/claude-haiku-5-5:low
  task: anthropic/claude-sonnet-5-5:high
  commit: anthropic/claude-haiku-5-5:low
  advisor: anthropic/claude-opus-5-5:max
  default: anthropic/claude-opus-5-5:xhigh
  slow: anthropic/claude-opus-5-5:max
  plan: anthropic/claude-opus-5-5:max
  memory: anthropic/claude-haiku-5-5:low
  widget: anthropic/claude-haiku-5-5:low
defaultThinkingLevel: xhigh
retry:
  fallbackOn: any
  fallbackChains:
    default:
      - deepseek/deepseek-v4-pro:xhigh
    slow:
      - deepseek/deepseek-v4-pro:xhigh
    advisor:
      - deepseek/deepseek-v4-pro:xhigh
    plan:
      - deepseek/deepseek-v4-pro:xhigh
    task:
      - deepseek/deepseek-v4-pro:high
    tiny:
      - deepseek/deepseek-flash:low
    smol:
      - deepseek/deepseek-flash:low
    commit:
      - deepseek/deepseek-flash:low
    memory:
      - deepseek/deepseek-flash:low
    widget:
      - deepseek/deepseek-flash:low
terminal:
  showProgress: true
display:
  cacheMissMarker: true
advisor:
  enabled: false
astGrep:
  enabled: true
statusLine:
  preset: custom
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  leftSegments:
    - model
    - mode
    - path
    - git
    - subagents
  rightSegments:
    - context_pct
    - usage
    - cost
    - cache_hit
    - token_total
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 24
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  compactThinkingLevel: false
  showHookStatus: true
task:
  maxConcurrency: 2
  agentAdvisor: {}
  agentModelOverrides: {}
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 20
secrets:
  enabled: true
autoResume: true
checkpoint:
  enabled: true
github:
  enabled: true
hideThinkingBlock: true
cycleOrder:
  - smol
  - default
  - slow
update:
  auto: false